<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>GC Tracker</title>
    <link rel="icon" href="./assets/icons/gc-tracker-elesis.png?v=20260726-icon">
    <link rel="stylesheet" href="./styles.css?v=20260727-desktop-electron">
  </head>
  <body>
    <aside class="sidebar">
      <div class="brand">
        <span class="brand-mark"><img src="./assets/icons/gc-tracker-elesis.png?v=20260726-icon" alt=""></span>
        <div>
          <strong>GC Tracker</strong>
          <small>conta local</small>
        </div>
      </div>
      <nav class="nav" aria-label="Seções">
        <button class="active" data-view="dashboard">Painel</button>
        <button data-view="characters">Personagens</button>
        <button data-view="daily">Rotina</button>
        <button data-view="voids">Itens</button>
        <button data-view="titles">Títulos</button>
        <button data-view="visualSet">Visual</button>
        <button data-view="visual">Coleção visual</button>
        <button data-view="gcfarm">GCFarm</button>
        <button data-view="automation">Automação</button>
      </nav>
      <div class="sidebar-footer">
        <button id="exportBtn">Exportar JSON</button>
        <label class="file-btn">
          Importar JSON
          <input id="importFile" type="file" accept="application/json">
        </label>
      </div>
    </aside>

    <main>
      <header class="topbar">
        <div>
          <p class="eyebrow">Grand Chase Classic</p>
          <h1 id="viewTitle">Painel da conta</h1>
        </div>
        <div class="top-actions">
          <input id="search" type="search" placeholder="Buscar personagem">
          <button id="resetBtn" title="Voltar para o snapshot da planilha">Resetar snapshot</button>
        </div>
      </header>

      <section id="dashboard" class="view active"></section>
      <section id="characters" class="view"></section>
      <section id="daily" class="view"></section>
      <section id="voids" class="view"></section>
      <section id="titles" class="view"></section>
      <section id="visualSet" class="view"></section>
      <section id="visual" class="view"></section>
      <section id="gcfarm" class="view"></section>
      <section id="automation" class="view"></section>
    </main>

    <dialog id="editor">
      <form method="dialog">
        <header>
          <h2 id="editorTitle">Editar</h2>
          <button value="cancel" class="icon-btn" aria-label="Fechar">x</button>
        </header>
        <div id="editorBody"></div>
        <footer>
          <button value="cancel">Cancelar</button>
          <button id="saveEditor" value="default">Salvar</button>
        </footer>
      </form>
    </dialog>

    <script src="./app.js?v=20260727-desktop-electron"></script>
  </body>
</html>
